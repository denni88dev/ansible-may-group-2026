- name: Install apache httpd (state=present is optional)
  ansible.builtin.apt: #-> apt
    name: "{{ package }}"      #-> apache2. in defaults folder->variable(key:value)
    state: "{{ state }}"     #-> install. in defaults folder->variable(key:value)
    update_cache: yes #-> true/yes - sudo apt update(ubuntu vm's)

- name: Start service httpd, if not started
  ansible.builtin.service:
    name: "{{ package }}"
    state: started  
    enabled: true  